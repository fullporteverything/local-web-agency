<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #090a09; color: #ecebe6; font-family: system-ui, sans-serif; text-align: center; padding: 16px; }
      p { color: #8e948f; }
      button { margin-top: 16px; border: 0; border-radius: 999px; padding: 12px 20px; background: #ecebe6; color: #0b0c0b; font-weight: 600; }
    </style>
  </head>
  <body>
    <div>
      <h1>You're offline</h1>
      <p>The business keeps running in the cloud. Reconnect to see what's new.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
